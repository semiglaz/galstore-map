<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Выбор ПВЗ — GalStore</title>

<script src="https://api-maps.yandex.ru/2.1/?apikey=a031f101-7f0b-4ef9-9399-a705c647d33f&lang=ru_RU" type="text/javascript"></script>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f4f5;color:#111}
header{padding:12px 14px;background:#fff;position:sticky;top:0;z-index:1000;box-shadow:0 1px 5px rgba(0,0,0,.08)}
h1{font-size:18px;margin:0 0 10px}
.row{display:flex;gap:8px}
.row input{flex:1;padding:10px;border:1px solid #ddd;border-radius:10px;font-size:16px}
.btn{border:0;border-radius:10px;padding:10px 12px;background:#111;color:#fff;font-size:14px}
.secondary{background:#e9e9e9;color:#111}
.filters{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px}
.filter{white-space:nowrap;border:1px solid #ddd;background:#fff;color:#111;border-radius:999px;padding:8px 11px}
.filter.active{background:#111;color:#fff;border-color:#111}
#map{height:50vh;min-height:330px}
.panel{background:#fff;padding:12px}
.city{font-size:14px;color:#666;margin-bottom:8px}
.point{padding:12px 0;border-bottom:1px solid #eee}
.point strong{display:block;font-size:15px}
.badge{display:inline-block;font-size:11px;border-radius:999px;padding:3px 7px;background:#eee;margin-bottom:5px}
.point small{display:block;color:#666;margin:4px 0 8px;line-height:1.35}
.hidden{display:none}
.error{color:#b00020;padding:10px 0}
.status{padding:4px 0 8px;color:#666;font-size:14px}
.empty{padding:20px 0;color:#666;text-align:center}
</style>
</head>

<body>

<header>
<h1>Выберите ПВЗ</h1>

<div class="filters" id="filters"></div>

<div class="row">
<input id="city" placeholder="Город, например Екатеринбург">
<button class="btn" id="search">Найти</button>
</div>

<div class="status" id="status">Определяем местоположение…</div>
</header>

<div id="map"></div>

<section class="panel">
<div class="city" id="cityLabel"></div>
<div id="error" class="error hidden"></div>
<div id="points"></div>
</section>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<script>

/* =========================================================
   TELEGRAM WEB APP
   ========================================================= */

const tg = window.Telegram?.WebApp;

tg?.ready();
tg?.expand();


/* =========================================================
   CHECKOUT TOKEN
   ========================================================= */

const urlParams = new URLSearchParams(location.search);

const token = urlParams.get('token') || '';

const initData = tg?.initData || '';


/* =========================================================
   GALSTORE BACKEND API
   =========================================================
   
   Яндекс.Карты работают отдельно.
   
   Все запросы к ПВЗ идут через backend GalStore,
   который запущен локально на порту 8080.
   
   НЕ путать с API Яндекс.Карт.
   ========================================================= */

const API_BASE_URL='https://127.0.0.1:8443';


/* =========================================================
   TOKEN CHECK
   ========================================================= */

if(!token){

    document.getElementById('error').textContent =
        'Не указан токен заказа';

    document.getElementById('error')
        .classList.remove('hidden');
}


/* =========================================================
   STATE
   ========================================================= */

let map = null;

const services = [
    ['all','Все'],
    ['cdek','СДЭК'],
    ['ozon','Ozon'],
    ['yandex_market','Яндекс Маркет'],
    ['fivepost','5Post']
];

let selected = 'all';

let allPoints = [];

let markers = [];

let currentCity = null;


/* =========================================================
   YANDEX MAP
   ========================================================= */

function initYandexMap(){

    map = new ymaps.Map('map',{

        center:[
            56.8389,
            60.6057
        ],

        zoom:10,

        controls:[
            'zoomControl',
            'geolocationControl',
            'searchControl'
        ]

    });

}


/* =========================================================
   API HEADERS
   ========================================================= */

function headers(){

    return {

        'X-Telegram-Init-Data': initData,

        'Content-Type':'application/json'

    };

}


/* =========================================================
   HTML ESCAPE
   ========================================================= */

function esc(s){

    return String(s ?? '')
        .replace(/[&<>'"]/g,c => ({

            '&':'&amp;',
            '<':'&lt;',
            '>':'&gt;',
            "'":'&#39;',
            '"':'&quot;'

        }[c]));

}


/* =========================================================
   CLEAR MAP MARKERS
   ========================================================= */

function clearMarkers(){

    if(!map){
        return;
    }

    markers.forEach(m => {

        map.geoObjects.remove(m);

    });

    markers = [];

}


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(t){

    document.getElementById('status')
        .textContent = t;

}


/* =========================================================
   ERROR
   ========================================================= */

function err(t){

    const e =
        document.getElementById('error');

    e.textContent = t;

    e.classList.remove('hidden');

}


/* =========================================================
   FILTERS
   ========================================================= */

function buildFilters(){

    const box =
        document.getElementById('filters');

    box.innerHTML = '';

    services.forEach(([code,name]) => {

        const b =
            document.createElement('button');

        b.className =
            'filter' +
            (code === selected ? ' active' : '');

        b.textContent = name;

        b.onclick = () => {

            selected = code;

            buildFilters();

            render(allPoints);

        };

        box.appendChild(b);

    });

}


/* =========================================================
   RENDER POINTS
   ========================================================= */

function render(points){

    const list =
        selected === 'all'
            ? points
            : points.filter(
                p => p.service_code === selected
            );

    clearMarkers();

    const box =
        document.getElementById('points');

    box.innerHTML = '';

    if(!list.length){

        box.innerHTML =
            '<div class="empty">' +
            'ПВЗ для выбранной службы не найдены.' +
            '</div>';

        return;

    }


    const bounds = [];


    list.forEach(p => {

        /* -----------------------------------------
           YANDEX MAP MARKER
           ----------------------------------------- */

        const marker =
            new ymaps.Placemark(

                [
                    Number(p.latitude),
                    Number(p.longitude)
                ],

                {

                    balloonContent:

                        `<b>${esc(p.service_name)}</b><br>` +

                        `<b>${esc(p.name)}</b><br>` +

                        `${esc(p.address)}`

                },

                {

                    preset:'islands#blueDotIcon',

                    openBalloonOnClick:true

                }

            );


        marker.events.add('click',() => {

            document
                .getElementById(
                    'point-' +
                    CSS.escape(
                        p.service_code +
                        '-' +
                        p.code
                    )
                )
                ?.scrollIntoView({

                    behavior:'smooth',

                    block:'center'

                });

        });


        map.geoObjects.add(marker);

        markers.push(marker);


        bounds.push([

            Number(p.latitude),

            Number(p.longitude)

        ]);


        /* -----------------------------------------
           POINT CARD
           ----------------------------------------- */

        const d =
            document.createElement('div');

        d.className = 'point';

        d.id =
            'point-' +
            p.service_code +
            '-' +
            p.code;


        d.innerHTML =

            `<span class="badge">` +
            `${esc(p.service_name)}` +
            `</span>` +

            `<strong>` +
            `${esc(p.name)}` +
            `</strong>` +

            `<small>` +
            `${esc(p.address)}` +

            (
                p.work_time
                    ? '<br>' +
                      esc(p.work_time)
                    : ''
            ) +

            `</small>`;


        const b =
            document.createElement('button');

        b.className = 'btn';

        b.textContent =
            'Выбрать этот ПВЗ';


        b.onclick = () => {

            selectPoint(p);

        };


        d.appendChild(b);

        box.appendChild(d);

    });


    /* -----------------------------------------
       FIT MAP TO POINTS
       ----------------------------------------- */

    if(bounds.length){

        map.setBounds(

            bounds,

            {

                checkZoomRange:true,

                zoomMargin:25,

                duration:300

            }

        );


        if(map.getZoom() > 13){

            map.setZoom(
                13,
                {
                    duration:200
                }
            );

        }

    }

}


/* =========================================================
   LOAD PICKUP POINTS
   ========================================================= */

async function load(){

    try{

        setStatus(
            'Загружаем ПВЗ…'
        );

        document
            .getElementById('error')
            .classList.add('hidden');


        const query =
            new URLSearchParams();


        if(currentCity?.name){

            query.set(
                'city',
                currentCity.name
            );

        }


        if(window._coords){

            query.set(
                'lat',
                window._coords.lat
            );

            query.set(
                'lon',
                window._coords.lon
            );

        }


        query.set(
            'services',
            'all'
        );


        /* =========================================
           ВАЖНО:
           API ЗАПРОС ИДЕТ НЕ В GITHUB PAGES,
           А В ЛОКАЛЬНЫЙ BACKEND GALSTORE.
           ========================================= */

        const r = await fetch(

            `${API_BASE_URL}/api/checkout/${token}/points?${query}`,

            {

                headers: headers()

            }

        );


        const j =
            await r.json();


        if(!r.ok || j.error){

            throw new Error(

                j.error ||
                'Не удалось получить ПВЗ'

            );

        }


        allPoints =
            j.points || [];


        currentCity =
            j.city ||
            currentCity;


        document
            .getElementById('cityLabel')
            .textContent =

                currentCity

                    ? `ПВЗ в городе: ${currentCity.name}`

                    : '';


        render(allPoints);


        const available =
            (j.services || [])
                .filter(x => x.available);


        setStatus(

            `Найдено ПВЗ: ${allPoints.length}` +

            (

                available.length

                    ? ` • ${available
                        .map(
                            x =>
                                x.name +
                                ': ' +
                                x.count
                        )
                        .join(' • ')}`

                    : ''

            )

        );


    }catch(e){

        console.error(e);

        err(
            e.message ||
            'Ошибка загрузки ПВЗ'
        );

        setStatus(
            'Не удалось загрузить ПВЗ'
        );

    }

}


/* =========================================================
   SELECT PICKUP POINT
   ========================================================= */

async function selectPoint(p){

    try{

        const cityCode =
            currentCity?.code;


        if(!cityCode){

            throw new Error(
                'Не удалось определить город'
            );

        }


        /* =========================================
           СОХРАНЯЕМ ВЫБРАННЫЙ ПВЗ ЧЕРЕЗ BACKEND
           ========================================= */

        const r = await fetch(

            `${API_BASE_URL}/api/checkout/${token}/select-point`,

            {

                method:'POST',

                headers:headers(),

                body:JSON.stringify({

                    service_code:
                        p.service_code,

                    point_code:
                        String(p.code),

                    city_code:
                        cityCode

                })

            }

        );


        const j =
            await r.json();


        if(!r.ok){

            throw new Error(

                j.error ||
                'Не удалось выбрать ПВЗ'

            );

        }


        /* =========================================
           ОТПРАВЛЯЕМ РЕЗУЛЬТАТ В TELEGRAM
           ========================================= */

        if(tg){

            tg.sendData(

                JSON.stringify({

                    checkout_token:
                        token,

                    service_code:
                        p.service_code,

                    point_code:
                        String(p.code)

                })

            );

            tg.close();

        }else{

            alert(
                'ПВЗ выбран'
            );

        }


    }catch(e){

        console.error(e);

        err(
            e.message ||
            'Ошибка выбора ПВЗ'
        );

    }

}


/* =========================================================
   CITY SEARCH
   ========================================================= */

document
    .getElementById('search')
    .onclick = () => {

        const q =
            document
                .getElementById('city')
                .value
                .trim();


        if(q){

            window._coords = null;

            currentCity = {

                name:q

            };

            load();

        }

    };


document
    .getElementById('city')
    .onkeydown = e => {

        if(e.key === 'Enter'){

            document
                .getElementById('search')
                .click();

        }

    };


/* =========================================================
   GEOLOCATION
   ========================================================= */

function locate(){

    if(!navigator.geolocation){

        setStatus(
            'Введите город вручную'
        );

        return;

    }


    navigator.geolocation.getCurrentPosition(

        p => {

            window._coords = {

                lat:
                    p.coords.latitude,

                lon:
                    p.coords.longitude

            };

            load();

        },

        () => {

            setStatus(
                'Введите город вручную'
            );

            load();

        },

        {

            enableHighAccuracy:true,

            timeout:8000

        }

    );

}


/* =========================================================
   START
   ========================================================= */

ymaps.ready(() => {

    initYandexMap();

    buildFilters();

    locate();

});

</script>

</body>
</html>
